{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add New Product</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 6px;
            color: #f5f5f5;
        }
        .subtitle {
            color: #8e8e8e;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #a8a8a8;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .form-group label .required {
            color: #ed4956;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 14px;
            color: #f5f5f5;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #555;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #0095f6;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group input[type="file"] {
            padding: 8px 0;
        }
        .form-group input[type="file"]::file-selector-button {
            background: #2a2a2a;
            color: #f5f5f5;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 12px;
        }
        .form-group input[type="file"]::file-selector-button:hover {
            background: #3a3a3a;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #0077c2;
        }
        .btn-secondary {
            background: #2a2a2a;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: #3a3a3a;
        }
        .messages {
            margin-bottom: 16px;
        }
        .messages .error {
            color: #ed4956;
            padding: 8px 12px;
            background: #ed495620;
            border-radius: 6px;
            border: 1px solid #ed495640;
        }
        .messages .success {
            color: #00a86b;
            padding: 8px 12px;
            background: #00a86b20;
            border-radius: 6px;
            border: 1px solid #00a86b40;
        }
        .preview-image {
            margin-top: 8px;
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            display: none;
        }
        .preview-image.show {
            display: block;
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Add New Product</h1>
        <p class="subtitle">Upload a new dress with description and pricing</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Product Name <span class="required">*</span></label>
                <input type="text" name="name" placeholder="e.g., Floral Summer Dress" required>
            </div>

            <div class="form-group">
                <label>Description <span class="required">*</span></label>
                <textarea name="description" placeholder="Describe the product..." required></textarea>
            </div>

            <div class="form-group">
                <label>Price (₹) <span class="required">*</span></label>
                <input type="number" name="price" placeholder="e.g., 2499" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Original Price (₹) <span style="color:#8e8e8e;font-weight:400;">(Optional)</span></label>
                <input type="number" name="original_price" placeholder="e.g., 3999" step="0.01">
            </div>

            <div class="form-group">
                <label>Category <span class="required">*</span></label>
                <select name="category" required>
                    <option value="">Select Category</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Footwear">Footwear</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Jewelry">Jewelry</option>
                    <option value="Bags">Bags</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Product Image <span class="required">*</span></label>
                <input type="file" name="image" accept="image/*" onchange="previewImage(event)" required>
                <img id="imagePreview" class="preview-image" alt="Preview">
            </div>

            <button type="submit" class="btn">➕ Add Product</button>
            <a href="{% url 'seller_dashboard' %}" class="btn btn-secondary" style="display:block;text-align:center;text-decoration:none;">Cancel</a>
        </form>
    </div>

    <script>
        function previewImage(event) {
            const preview = document.getElementById('imagePreview');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.add('show');
                };
                reader.readAsDataURL(file);
            } else {
                preview.classList.remove('show');
            }
        }
    </script>
</body>
</html>
